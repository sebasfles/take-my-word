name: reusable-deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Actions environment holding the deploy role and function names
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and swap the function code
        env:
          DICTATE_FUNCTION_NAME: ${{ vars.DICTATE_FUNCTION_NAME }}
          AUTHORIZER_FUNCTION_NAME: ${{ vars.AUTHORIZER_FUNCTION_NAME }}
          API_FUNCTION_NAME: ${{ vars.API_FUNCTION_NAME }}
          DICTIONARY_USAGE_FUNCTION_NAME: ${{ vars.DICTIONARY_USAGE_FUNCTION_NAME }}
        run: pnpm deploy:api
