name: desktop-ci

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - apps/desktop/**
      - packages/shared/**
      - packages/brand/**
      - .github/workflows/desktop-ci.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: UI lint, typecheck and tests
        working-directory: apps/desktop
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build the UI the shell embeds
        working-directory: apps/desktop
        run: pnpm build

      - name: Rust format, lint and tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --release --features dev --locked -- -D warnings
          cargo test --locked -- --include-ignored --test-threads=1

      - name: Build the dev NSIS installer
        working-directory: apps/desktop
        run: pnpm tauri:build:dev

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: take-my-word-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  linux-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: System libraries for Tauri, ALSA and enigo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxdo-dev libxkbcommon-dev libssl-dev

      - name: Install dependencies and build the UI the shell embeds
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @take-my-word/desktop build

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Non-Windows build stays compiling
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
