name: reusable-changes

on:
  workflow_call:
    outputs:
      api:
        description: Whether the push touches what the api Lambdas are built from
        value: ${{ jobs.changes.outputs.api }}
      web:
        description: Whether the push touches what the web is built from
        value: ${{ jobs.changes.outputs.web }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare the push with the previous head
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No previous head to compare with; deploying everything."
            { echo "api=true"; echo "web=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          common='^(packages/shared/|\.github/workflows/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'
          touches() {
            if grep -Eq -e "$1" -e "$common" <<< "$files"; then echo true; else echo false; fi
          }

          {
            echo "api=$(touches '^apps/api/')"
            echo "web=$(touches '^(apps/web/|packages/cognito/|packages/brand/)')"
          } >> "$GITHUB_OUTPUT"
