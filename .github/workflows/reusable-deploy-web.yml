name: reusable-deploy-web

on:
  workflow_call:
    inputs:
      environment:
        description: Actions environment holding the deploy role, the web function, bucket and distribution
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with OpenNext and package the server function
        env:
          RELEASES_REPOSITORY: ${{ github.repository }}
          WEB_INDEXED_ORIGIN: ${{ vars.WEB_INDEXED_ORIGIN }}
        run: pnpm deploy:web build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload the assets, swap the code and invalidate
        env:
          WEB_FUNCTION_NAME: ${{ vars.WEB_FUNCTION_NAME }}
          WEB_ASSETS_BUCKET: ${{ vars.WEB_ASSETS_BUCKET }}
          WEB_DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
        run: pnpm deploy:web swap
