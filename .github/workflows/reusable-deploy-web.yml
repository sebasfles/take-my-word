name: reusable-deploy-web

on:
  workflow_call:
    inputs:
      environment:
        description: Actions environment holding the deploy role, the web function, bucket and distribution
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with OpenNext
        run: pnpm --filter @take-my-word/web bundle

      - name: Package the server function
        working-directory: apps/web/.open-next/server-functions/default
        run: |
          zip -qry "$RUNNER_TEMP/web.zip" .
          ls -lh "$RUNNER_TEMP/web.zip"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload the immutable assets
        working-directory: apps/web/.open-next/assets
        env:
          WEB_ASSETS_BUCKET: ${{ vars.WEB_ASSETS_BUCKET }}
        run: |
          aws s3 sync . "s3://$WEB_ASSETS_BUCKET" \
            --exclude '*' \
            --include '_next/static/*' \
            --cache-control 'public,max-age=31536000,immutable' \
            --no-progress

      - name: Update the function code
        env:
          WEB_FUNCTION_NAME: ${{ vars.WEB_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$WEB_FUNCTION_NAME" \
            --zip-file "fileb://$RUNNER_TEMP/web.zip" \
            --query '[FunctionName,CodeSha256]' \
            --output text \
            --no-cli-pager
          aws lambda wait function-updated-v2 --function-name "$WEB_FUNCTION_NAME"

      - name: Upload the remaining assets
        working-directory: apps/web/.open-next/assets
        env:
          WEB_ASSETS_BUCKET: ${{ vars.WEB_ASSETS_BUCKET }}
        run: |
          aws s3 sync . "s3://$WEB_ASSETS_BUCKET" \
            --exclude '_next/static/*' \
            --cache-control 'public,max-age=300,must-revalidate' \
            --no-progress

      - name: Invalidate the distribution
        env:
          WEB_DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$WEB_DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text \
            --no-cli-pager
