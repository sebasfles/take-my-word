name: desktop-release

on:
  push:
    tags:
      - desktop-v*

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FIXED_INSTALLER: take-my-word-windows-x64-setup.exe
  PRD_CONFIG: apps/desktop/src-tauri/tauri.prd.conf.json

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read the version and notes from the annotated tag
        id: tag
        run: |
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != tag ]]; then
            echo "::error::$TAG is a lightweight tag; pnpm release:desktop creates an annotated tag carrying the notes"
            exit 1
          fi
          notes="$(git tag --list --format='%(contents)' "$TAG")"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "::error::$TAG has no message; the tag message is the release notes"
            exit 1
          fi
          version="${TAG#desktop-v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          delimiter="notes-$(openssl rand -hex 16)"
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "notes<<$delimiter"
            echo "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: The tag names the app version
        run: node apps/desktop/scripts/version.ts --tag "$TAG"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build, sign and create the draft release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.prd.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Take My Word ${{ steps.tag.outputs.version }}
          releaseBody: ${{ steps.tag.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Upload the installer under its fixed name
        run: |
          shopt -s nullglob
          installers=(apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "::error::expected one NSIS installer, found ${#installers[@]}"
            exit 1
          fi
          cp "${installers[0]}" "$RUNNER_TEMP/$FIXED_INSTALLER"
          gh release upload "$TAG" "$RUNNER_TEMP/$FIXED_INSTALLER" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify latest.json and the installers against the committed public key
        run: |
          assets="$RUNNER_TEMP/release-assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets" \
            --pattern latest.json --pattern '*.exe'
          node apps/desktop/scripts/release-check.ts --dir "$assets" --config "$PRD_CONFIG" \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG"

      - name: Publish as the latest release
        if: steps.tag.outputs.prerelease == 'false'
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: The public links serve this version
        if: steps.tag.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          for attempt in 1 2 3 4 5 6; do
            announced="$(curl -fsSL "$base/latest.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version' || true)"
            if [[ "$announced" == "$VERSION" ]] && curl -fsSIL -o /dev/null "$base/$FIXED_INSTALLER"; then
              echo "attempt $attempt: latest.json announces $VERSION and $FIXED_INSTALLER downloads"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the latest links do not serve $VERSION yet (latest.json says '$announced')"
          exit 1
