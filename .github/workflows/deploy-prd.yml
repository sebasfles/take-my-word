name: deploy-prd

on:
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - packages/shared/**
      - .github/workflows/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: deploy-prd
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: prd
