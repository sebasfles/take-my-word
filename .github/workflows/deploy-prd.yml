name: deploy-prd

on:
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - apps/web/**
      - packages/shared/**
      - packages/cognito/**
      - .github/workflows/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: deploy-prd
  cancel-in-progress: false

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-changes.yml

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: prd

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-web.yml
    with:
      environment: prd
