[package]
name = "take-my-word"
version = "0.1.1"
edition = "2024"
publish = false

[lib]
name = "take_my_word_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
dev = []
prd = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2.10"
tauri-plugin-autostart = "2.7"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cpal = "0.18"
rubato = "5"
hound = "3.5"
enigo = "0.6"
sys-locale = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "tokio"] }
tokio = { version = "1", features = ["net", "time"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "native-tls"] }
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
num-bigint = "0.4"
sha2 = "0.10"
time = "0.3"
zeroize = "1"

[dev-dependencies]
schemars = "1.2"

[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = { version = "1.1", default-features = false }
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
